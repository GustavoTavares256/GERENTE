services:
  postgres:
    image: postgres:16
    container_name: codxis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codxis
      POSTGRES_PASSWORD: codxis
      POSTGRES_DB: codxis
    ports:
      - "5433:5432"
    volumes:
      - codxis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codxis -d codxis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codxis_pgdata:
